# Proves the claim in the README: every rendered copy of the directive is current,
# and re-rendering from SKILL.md changes nothing. Fails if someone edited a rendered
# file by hand or forgot to run scripts/render.sh after changing the source.
name: doctor

on:
  push:
    branches: [main]
  pull_request:

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every rendered copy carries the current directive
        run: scripts/doctor.sh --repo

      - name: Re-rendering from the source is a no-op
        run: |
          scripts/render.sh
          git diff --exit-code -- . || {
            echo "::error::Rendered files are out of date. Run scripts/render.sh and commit the result."
            exit 1
          }
